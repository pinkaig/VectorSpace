name: build-and-test

on:
  push:
    branches: [Working, main]
  pull_request:
    branches: [Working, main]

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VectorSpace
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: VectorSpace/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vectorspace
          POSTGRES_USER: vectorspace_app
          POSTGRES_PASSWORD: vectorspace_local
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vectorspace_app -d vectorspace"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: VectorSpace/apps/api/requirements.txt

      - name: Install API dependencies
        run: pip install -r VectorSpace/apps/api/requirements.txt

      - name: Run API tests
        working-directory: VectorSpace
        run: python -m pytest apps/api/tests -q

      - name: Migrations apply to a real Postgres (up, down, up)
        working-directory: VectorSpace/apps/api
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
