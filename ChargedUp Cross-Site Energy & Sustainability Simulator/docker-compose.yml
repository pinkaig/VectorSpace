services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: chargedup
      POSTGRES_USER: chargedup_app
      POSTGRES_PASSWORD: chargedup_local
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargedup_app -d chargedup"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      APP_ENV: local
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

