                submitted_at: null
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - projects
      summary: Update Project
      operationId: update_project_api_v1_projects__project_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
        example: 22d31f69-7837-484d-a070-c071b896480d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
            example:
              class_id: 885e519c-5337-499d-b5d9-3c609de67f17
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
              example:
                id: 22d31f69-7837-484d-a070-c071b896480d
                organisation_id: b1f0c40c-8f28-4a3c-8e57-1e43de5d7a17
                created_by_id: 0fa4f0e7-794b-4eef-9838-28ac60f74a22
