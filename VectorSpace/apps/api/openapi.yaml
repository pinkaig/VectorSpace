openapi: 3.1.0
info:
  title: VectorSpace API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
              example:
                status: ok
                service: vectorspace-api
  /api/v1/me:
    get:
      tags:
      - me
      summary: Me
      operationId: me_api_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                id: 06a69ee4-f714-42b1-850e-3a3d568c6bab
                organisation_id: dda931a3-b138-454b-9c09-682c47448297
                display_name: s1
                role: student
                class_ids:
                - db5997cb-29cd-4715-90a6-efc4182d4cba
      security:
      - HTTPBearer: []
  /api/v1/admin/schools:
    get:
      tags:
      - admin
      summary: List Schools
      description: Every school, by name. An admin is VThere staff and sees them all (D-A).
      operationId: list_schools_api_v1_admin_schools_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SchoolResponse'
                type: array
                title: Response List Schools Api V1 Admin Schools Get
              example:
              - id: bf2df751-1fe0-44e6-bc6c-08c337b20187
                name: A
                students: 3
                educators: 2
                status: active
              - id: 88d41b2e-5643-4d34-b9fa-f7a1b0f09ad4
                name: B
                students: 0
                educators: 1
                status: setting_up
      security:
      - HTTPBearer: []
    post:
      tags:
      - admin
      summary: Add School
      description: 'A new, empty school: no people and no classes, so it starts as setting_up. The slug
        is made

        from the name, the same identifier `python -m app.provision --school-slug` uses, so a roster

        CSV can be run against a school made here. Two schools may not share a slug.'
      operationId: add_school_api_v1_admin_schools_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSchoolRequest'
            example:
              name: '  Riverside Primary '
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolResponse'
              example:
                id: 3c3bdf3c-12b7-4f29-b4ba-0ff52167ae9e
                name: Riverside Primary
                students: 0
                educators: 0
                status: setting_up
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/admin/accounts:
    get:
      tags:
      - admin
      summary: List Accounts
      operationId: list_accounts_api_v1_admin_accounts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: school
        in: query
        required: false
        schema:
          type: string
          default: all
          title: School
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
                title: Response List Accounts Api V1 Admin Accounts Get
              example:
              - id: 6ee42d51-b720-4e20-b718-6f765682282e
                school_id: bf2df751-1fe0-44e6-bc6c-08c337b20187
                name: admin
                email: admin@x.test
                role: admin
                class_names: []
                last_active: null
                status: invited
              - id: aa9633d4-2e27-4b2b-9007-1de6adc807b3
                school_id: 88d41b2e-5643-4d34-b9fa-f7a1b0f09ad4
                name: other
                email: other@x.test
                role: teacher
                class_names: []
                last_active: null
                status: invited
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - admin
      summary: Add Account
      description: 'The same provisioning path as the CSV tool and the seed: a login, an actor row, its
        classes.


        Nobody signs themselves up, so creating an account means creating a login first. With

        AUTH_DEV_BYPASS the login is a local "dev|..." stand-in; otherwise it is a real Auth0 user.


        The reply carries that login''s one-time password-set link, which is the only way in: nothing

        emails it, because create_user marks the address verified on purpose so that roster addresses

        need not be real ones. Hand it over and do not keep it -- it is a credential, so it is never

        logged, never stored and never put in a URL.'
      operationId: add_account_api_v1_admin_accounts_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccountRequest'
            example:
              school_id: 2a15042c-ba66-4e41-9a58-c474b421abe4
              name: New Person
              email: New.Person@x.test
              role: student
              class_names:
              - 1A
              - 3C
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAccountResponse'
              example:
                id: 8d7676e7-75d0-4c9f-a47b-04b70c906ac3
                school_id: 2a15042c-ba66-4e41-9a58-c474b421abe4
                name: New Person
                email: new.person@x.test
                role: student
                class_names:
                - 1A
                - 3C
                last_active: null
                status: invited
                invite_link: https://tenant.test/invite/new.person@x.test
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/accounts/{account_id}:
    patch:
      tags:
      - admin
      summary: Set Account Active
      description: Turn an account off or back on. Accounts are never deleted; their work would go with
        them.
      operationId: set_account_active_api_v1_admin_accounts__account_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
        example: 13b4754d-2975-4b98-99da-de82a7dc5b32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatchRequest'
            example:
              active: false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
              example:
                id: 13b4754d-2975-4b98-99da-de82a7dc5b32
                school_id: 4335d3f8-780e-4424-ade7-a3d4874a70a7
                name: s1
                email: s1@x.test
                role: student
                class_names:
                - 1A
                last_active: null
                status: turned_off
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/accounts/{account_id}/invite:
    post:
      tags:
      - admin
      summary: New Sign In Link
      description: 'A fresh one-time sign-in link for somebody who lost theirs, or forgot their password.


        Admin only (Sherman, 7 Nov): what a teacher may do for their students is not decided yet, so

        credentials come from one place. Same handling as the create reply: hand it over, never keep

        it. A turned-off account gets 409 rather than a link that would sign in to nothing.'
      operationId: new_sign_in_link_api_v1_admin_accounts__account_id__invite_post
      security:
      - HTTPBearer: []
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
        example: 13c469ad-5536-483c-aa3a-1a288d013374
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInLinkResponse'
              example:
                account_id: 13c469ad-5536-483c-aa3a-1a288d013374
                invite_link: https://tenant.test/again/s1
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/accounts/import:
    post:
      tags:
      - admin
      summary: Import Accounts
      description: "Many accounts from one CSV, in the CLI's format (provision.parse_rows reads both).\n\
        \nDiffers from the CLI on purpose in two ways:\n- An address the school already has is skipped\
        \ and reported, never updated. A web upload must\n  not quietly change somebody's role or turn\
        \ a turned-off account back on (the same reason\n  POST /accounts answers 409).\n- Each row is\
        \ committed on its own. If Auth0 fails on row 17, rows 1-16 are saved with their\n  logins, row\
        \ 17 says what went wrong, and running the same file again skips what was made.\n\nClasses named\
        \ in the file are made in that school if they do not exist yet. The reply has one\nrow per line;\
        \ created rows carry their one-time link, which is shown here and nowhere else."
      operationId: import_accounts_api_v1_admin_accounts_import_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
            example:
              school_id: 9aa8a188-dd21-4fc8-a3ee-64dcd0a70b1e
              csv: 'Email,Display_Name,Role,Classes

                new1@x.test,New One,student,3C

                S1@x.test,Already Here,teacher,

                new2@x.test,New Two,principal,

                new1@x.test,New One Again,student,

                new3@x.test,New Three,teacher,3C;3D

                '
              dry_run: true
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
              example:
                school_id: 9aa8a188-dd21-4fc8-a3ee-64dcd0a70b1e
                dry_run: true
                rows:
                - line: 2
                  email: new1@x.test
                  name: New One
                  role: student
                  class_names:
                  - 3C
                  outcome: would_create
                  account_id: null
                  invite_link: null
                  error: null
                - line: 3
                  email: s1@x.test
                  name: Already Here
                  role: teacher
                  class_names: []
                  outcome: skipped_exists
                  account_id: 8ac67b5d-53a4-4535-8ad2-f564cb6ec51b
                  invite_link: null
                  error: null
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/admin/overview:
    get:
      tags:
      - admin
      summary: Get Overview
      description: The four numbers, the schools table, what needs an admin, and what was published recently.
      operationId: get_overview_api_v1_admin_overview_get
      security:
      - HTTPBearer: []
      parameters:
      - name: school
        in: query
        required: false
        schema:
          type: string
          default: all
          title: School
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
              example:
                tiles:
                  schools:
                    value: 2
                    sub: 1 active
                  educators:
                    value: 3
                    sub: 3 not signed in yet
                  students:
                    value: 3
                    sub: 0 active this week
                  published:
                    value: 0
                    sub: 0 still drafts
                schools:
                - id: bf2df751-1fe0-44e6-bc6c-08c337b20187
                  name: A
                  students: 3
                  educators: 2
                  status: active
                - id: 88d41b2e-5643-4d34-b9fa-f7a1b0f09ad4
                  name: B
                  students: 0
                  educators: 1
                  status: setting_up
                attention:
                - id: setting-up-88d41b2e-5643-4d34-b9fa-f7a1b0f09ad4
                  text: B has no students yet
                  action_label: Add accounts
                  go_to: accounts
                - id: no-classes-88d41b2e-5643-4d34-b9fa-f7a1b0f09ad4
                  text: B has no classes yet
                  action_label: Add accounts
                  go_to: accounts
                recent: []
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/schools/{school}/packs:
    get:
      tags:
      - admin
      summary: List School Packs
      description: 'Every published pack, and whether this school has it switched on. A draft is not listed:

        a school must never be offered a pack whose manifest is not in the bucket yet.'
      operationId: list_school_packs_api_v1_admin_schools__school__packs_get
      security:
      - HTTPBearer: []
      parameters:
      - name: school
        in: path
        required: true
        schema:
          type: string
          title: School
        example: af89d1fd-5b17-41d1-87b9-c0e0548e275d
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchoolPackResponse'
                title: Response List School Packs Api V1 Admin Schools  School  Packs Get
              example:
              - id: 0f9352e6-3020-481d-8a0a-6038125215a3
                slug: fossils
                title: Fossils
                description: null
                kind: objects
                item_count: 1
                revision: 1
                enabled: false
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/schools/{school}/packs/{pack_id}:
    patch:
      tags:
      - admin
      summary: Set School Pack
      operationId: set_school_pack_api_v1_admin_schools__school__packs__pack_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: school
        in: path
        required: true
        schema:
          type: string
          title: School
        example: af89d1fd-5b17-41d1-87b9-c0e0548e275d
      - name: pack_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pack Id
        example: 0f9352e6-3020-481d-8a0a-6038125215a3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolPackPatch'
            example:
              enabled: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolPackResponse'
              example:
                id: 0f9352e6-3020-481d-8a0a-6038125215a3
                slug: fossils
                title: Fossils
                description: null
                kind: objects
                item_count: 1
                revision: 1
                enabled: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/schools/{school}/permissions:
    get:
      tags:
      - admin
      summary: List School Permissions
      description: Every setting for one school, saved or default, in the order the page shows them.
      operationId: list_school_permissions_api_v1_admin_schools__school__permissions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: school
        in: path
        required: true
        schema:
          type: string
          title: School
        example: 8815994b-60da-4d0e-9802-d7771f767783
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionResponse'
                title: Response List School Permissions Api V1 Admin Schools  School  Permissions Get
              example:
              - key: more-rooms
                group: Building
                label: Add more rooms (up to 5 per project)
                students: true
                educators: true
                can_adjust: false
                enforced: false
              - key: publish-no-approval
                group: Sharing
                label: Publish without approval
                students: false
                educators: true
                can_adjust: false
                enforced: false
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - admin
      summary: Save School Permissions
      description: 'Save the settings sent; a key left out keeps what it had. All or nothing: one unknown
        key

        and nothing is saved, so a page built against an older list cannot half-save.'
      operationId: save_school_permissions_api_v1_admin_schools__school__permissions_put
      security:
      - HTTPBearer: []
      parameters:
      - name: school
        in: path
        required: true
        schema:
          type: string
          title: School
        example: a3e098e6-4bb7-467c-895a-e76e25a36f3f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PermissionSetting'
              title: Body
            example:
            - key: from-templates
              students: true
              educators: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionResponse'
                title: Response Save School Permissions Api V1 Admin Schools  School  Permissions Put
              example:
              - key: more-rooms
                group: Building
                label: Add more rooms (up to 5 per project)
                students: true
                educators: true
                can_adjust: false
                enforced: false
              - key: publish-no-approval
                group: Sharing
                label: Publish without approval
                students: false
                educators: true
                can_adjust: false
                enforced: false
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes:
    get:
      tags:
      - classes
      summary: List Classes
      operationId: list_classes_api_v1_classes_get
      security:
      - HTTPBearer: []
      parameters:
      - name: school
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: 'admins only: just this school''s classes'
          title: School
        description: 'admins only: just this school''s classes'
        example: 74643421-0bbc-46f3-84dd-5b91ff22f76e
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassResponse'
                title: Response List Classes Api V1 Classes Get
              example:
              - id: b2543fd7-3249-49db-932a-58a713651a1e
                school_id: 74643421-0bbc-46f3-84dd-5b91ff22f76e
                name: 1A
                member_count: 3
              - id: 06ee77da-dad2-4125-9c15-262d5a06ba6d
                school_id: 74643421-0bbc-46f3-84dd-5b91ff22f76e
                name: 2B
                member_count: 2
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - classes
      summary: Create Class
      description: An empty class. A teacher who makes one teaches it, so they are put in it straight
        away.
      operationId: create_class_api_v1_classes_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewClassRequest'
            example:
              name: B1
              school_id: 6c146f95-ff84-4fb8-bd26-6c5fd67be406
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassResponse'
              example:
                id: 3f42d0fb-7903-4c77-b97c-4b537a6f20ff
                school_id: 6c146f95-ff84-4fb8-bd26-6c5fd67be406
                name: B1
                member_count: 0
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes/{class_id}/members:
    get:
      tags:
      - classes
      summary: List Members
      description: The roster, for teachers and admins. 404 for a class the caller is not in; students
        may not list a roster.
      operationId: list_members_api_v1_classes__class_id__members_get
      security:
      - HTTPBearer: []
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Class Id
        example: 4647e8ad-1acb-4506-838f-f9fe8cfe1d22
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberResponse'
                title: Response List Members Api V1 Classes  Class Id  Members Get
              example:
              - id: f481d0ce-3bdc-4c68-a0d9-6763e86ccef2
                display_name: t1
                role: teacher
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - classes
      summary: Add Member
      description: 'Put someone in a class. Already in it is fine: the answer is the same, nothing changes.'
      operationId: add_member_api_v1_classes__class_id__members_post
      security:
      - HTTPBearer: []
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Class Id
        example: b2d9fd89-fd5c-4175-958f-34eafccecb6c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
            example:
              actor_id: b9135a6d-0c55-4241-8ff1-286d7328811c
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
              example:
                id: b9135a6d-0c55-4241-8ff1-286d7328811c
                display_name: s3
                role: student
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes/{class_id}/members/{actor_id}:
    delete:
      tags:
      - classes
      summary: Remove Member
      description: Take someone out of a class. Their account and their work stay; only the membership
        goes.
      operationId: remove_member_api_v1_classes__class_id__members__actor_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Class Id
        example: b2d9fd89-fd5c-4175-958f-34eafccecb6c
      - name: actor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Actor Id
        example: b9135a6d-0c55-4241-8ff1-286d7328811c
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
