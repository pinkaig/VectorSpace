openapi: 3.1.0
info:
  title: VectorSpace API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
              example:
                status: ok
                service: vectorspace-api
  /api/v1/me:
    get:
      tags:
      - me
      summary: Me
      operationId: me_api_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                id: f1651845-5996-4c64-8635-8899296de023
                organisation_id: f1e887de-c2d2-4672-84ee-b5b45b1ed2ea
                display_name: s1
                role: student
                class_ids:
                - 23bdffb6-9eff-4a9e-96bd-ef8cb96792ec
      security:
      - HTTPBearer: []
  /api/v1/admin/schools:
    get:
      tags:
      - admin
      summary: List Schools
      description: Every school, by name. An admin is VThere staff and sees them all (D-A).
      operationId: list_schools_api_v1_admin_schools_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SchoolResponse'
                type: array
                title: Response List Schools Api V1 Admin Schools Get
              example:
              - id: 75419eea-100f-4cdf-aea9-7e8504137a7c
                name: A
                students: 3
                educators: 2
                status: active
              - id: e4ed1c4f-4a97-4313-9b52-27bbbd5b897a
                name: B
                students: 0
                educators: 1
                status: setting_up
      security:
      - HTTPBearer: []
    post:
      tags:
      - admin
      summary: Add School
      description: 'A new, empty school: no people and no classes, so it starts as setting_up. The slug
        is made

        from the name, the same identifier `python -m app.provision --school-slug` uses, so a roster

        CSV can be run against a school made here. Two schools may not share a slug.'
      operationId: add_school_api_v1_admin_schools_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSchoolRequest'
            example:
              name: '  Riverside Primary '
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolResponse'
              example:
                id: 37114d5d-4c3a-4b4d-bb76-52d88d2c80c3
                name: Riverside Primary
                students: 0
                educators: 0
                status: setting_up
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/admin/accounts:
    get:
      tags:
      - admin
      summary: List Accounts
      operationId: list_accounts_api_v1_admin_accounts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: school
        in: query
        required: false
        schema:
          type: string
          default: all
          title: School
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
                title: Response List Accounts Api V1 Admin Accounts Get
              example:
              - id: 9dd875ba-7fb2-4ec0-8965-88afc80e22ce
                school_id: 75419eea-100f-4cdf-aea9-7e8504137a7c
                name: admin
                email: admin@x.test
                role: admin
                class_names: []
                last_active: null
                status: invited
              - id: a60a1e0f-557c-42d7-acdb-973344e664b4
                school_id: e4ed1c4f-4a97-4313-9b52-27bbbd5b897a
                name: other
                email: other@x.test
                role: teacher
                class_names: []
                last_active: null
                status: invited
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - admin
      summary: Add Account
      description: 'The same provisioning path as the CSV tool and the seed: a login, an actor row, its
        classes.


        Nobody signs themselves up, so creating an account means creating a login first. With

        AUTH_DEV_BYPASS the login is a local "dev|..." stand-in; otherwise it is a real Auth0 user.


        The reply carries that login''s one-time password-set link, which is the only way in: nothing

        emails it, because create_user marks the address verified on purpose so that roster addresses

        need not be real ones. Hand it over and do not keep it -- it is a credential, so it is never

        logged, never stored and never put in a URL.'
      operationId: add_account_api_v1_admin_accounts_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccountRequest'
            example:
              school_id: f0491300-4c28-4a31-805f-cc93e0aa0e11
              name: New Person
              email: New.Person@x.test
              role: student
              class_names:
              - 1A
              - 3C
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAccountResponse'
              example:
                id: 972d8a4a-fd9e-4063-9ee3-cb44c7a517d0
                school_id: f0491300-4c28-4a31-805f-cc93e0aa0e11
                name: New Person
                email: new.person@x.test
                role: student
                class_names:
                - 1A
                - 3C
                last_active: null
                status: invited
                invite_link: https://tenant.test/invite/new.person@x.test
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/accounts/{account_id}:
    patch:
      tags:
      - admin
      summary: Set Account Active
      description: Turn an account off or back on. Accounts are never deleted; their work would go with
        them.
      operationId: set_account_active_api_v1_admin_accounts__account_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
        example: 0ed943cc-492c-4660-8493-e817a8eae8b2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatchRequest'
            example:
              active: false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
              example:
                id: 0ed943cc-492c-4660-8493-e817a8eae8b2
                school_id: d9e92c61-ab2f-4646-ba77-781607b40b37
                name: s1
                email: s1@x.test
                role: student
                class_names:
                - 1A
                last_active: null
                status: turned_off
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/accounts/{account_id}/invite:
    post:
      tags:
      - admin
      summary: New Sign In Link
      description: 'A fresh one-time sign-in link for somebody who lost theirs, or forgot their password.


        Admin only (Sherman, 7 Nov): what a teacher may do for their students is not decided yet, so

        credentials come from one place. Same handling as the create reply: hand it over, never keep

        it. A turned-off account gets 409 rather than a link that would sign in to nothing.'
      operationId: new_sign_in_link_api_v1_admin_accounts__account_id__invite_post
      security:
      - HTTPBearer: []
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
        example: 0e937dd4-2551-410e-9b06-b92a358404b8
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInLinkResponse'
              example:
                account_id: 0e937dd4-2551-410e-9b06-b92a358404b8
                invite_link: https://tenant.test/again/s1
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/overview:
    get:
      tags:
      - admin
      summary: Get Overview
      description: The four numbers, the schools table, what needs an admin, and what was published recently.
      operationId: get_overview_api_v1_admin_overview_get
      security:
      - HTTPBearer: []
      parameters:
      - name: school
        in: query
        required: false
        schema:
          type: string
          default: all
          title: School
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
              example:
                tiles:
                  schools:
                    value: 2
                    sub: 1 active
                  educators:
                    value: 3
                    sub: 3 not signed in yet
                  students:
                    value: 3
                    sub: 0 active this week
                  published:
                    value: 0
                    sub: 0 still drafts
                schools:
                - id: 75419eea-100f-4cdf-aea9-7e8504137a7c
                  name: A
                  students: 3
                  educators: 2
                  status: active
                - id: e4ed1c4f-4a97-4313-9b52-27bbbd5b897a
                  name: B
                  students: 0
                  educators: 1
                  status: setting_up
                attention:
                - id: setting-up-e4ed1c4f-4a97-4313-9b52-27bbbd5b897a
                  text: B has no students yet
                  action_label: Add accounts
                  go_to: accounts
                - id: no-classes-e4ed1c4f-4a97-4313-9b52-27bbbd5b897a
                  text: B has no classes yet
                  action_label: Add accounts
                  go_to: accounts
                recent: []
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/schools/{school}/packs:
    get:
      tags:
      - admin
      summary: List School Packs
      description: 'Every published pack, and whether this school has it switched on. A draft is not listed:

        a school must never be offered a pack whose manifest is not in the bucket yet.'
      operationId: list_school_packs_api_v1_admin_schools__school__packs_get
      security:
      - HTTPBearer: []
      parameters:
      - name: school
        in: path
        required: true
        schema:
          type: string
          title: School
        example: c470ec5f-6b18-4df4-866a-5fef5f7cbbd3
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SchoolPackResponse'
                title: Response List School Packs Api V1 Admin Schools  School  Packs Get
              example:
              - id: eeb6ebca-2c93-4db8-a4bd-f2cfe0d2ff8f
                slug: fossils
                title: Fossils
                description: null
                kind: objects
                item_count: 1
                revision: 1
                enabled: false
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/schools/{school}/packs/{pack_id}:
    patch:
      tags:
      - admin
      summary: Set School Pack
      operationId: set_school_pack_api_v1_admin_schools__school__packs__pack_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: school
        in: path
        required: true
        schema:
          type: string
          title: School
        example: c470ec5f-6b18-4df4-866a-5fef5f7cbbd3
      - name: pack_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Pack Id
        example: eeb6ebca-2c93-4db8-a4bd-f2cfe0d2ff8f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolPackPatch'
            example:
              enabled: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolPackResponse'
              example:
                id: eeb6ebca-2c93-4db8-a4bd-f2cfe0d2ff8f
                slug: fossils
                title: Fossils
                description: null
                kind: objects
                item_count: 1
                revision: 1
                enabled: true
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/schools/{school}/permissions:
    get:
      tags:
      - admin
      summary: List School Permissions
      description: Every setting for one school, saved or default, in the order the page shows them.
      operationId: list_school_permissions_api_v1_admin_schools__school__permissions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: school
        in: path
        required: true
        schema:
          type: string
          title: School
        example: 6cd31a3e-24a5-46f3-b3bd-cbaeb09990b2
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionResponse'
                title: Response List School Permissions Api V1 Admin Schools  School  Permissions Get
              example:
              - key: more-rooms
                group: Building
                label: Add more rooms (up to 5 per project)
                students: true
                educators: true
                can_adjust: false
                enforced: false
              - key: publish-no-approval
                group: Sharing
                label: Publish without approval
                students: false
                educators: true
                can_adjust: false
                enforced: false
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - admin
      summary: Save School Permissions
      description: 'Save the settings sent; a key left out keeps what it had. All or nothing: one unknown
        key

        and nothing is saved, so a page built against an older list cannot half-save.'
      operationId: save_school_permissions_api_v1_admin_schools__school__permissions_put
      security:
      - HTTPBearer: []
      parameters:
      - name: school
        in: path
        required: true
        schema:
          type: string
          title: School
        example: 27907e3b-fab8-4b34-83c4-6a1cd6c1c65a
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PermissionSetting'
              title: Body
            example:
            - key: from-templates
              students: true
              educators: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionResponse'
                title: Response Save School Permissions Api V1 Admin Schools  School  Permissions Put
              example:
              - key: more-rooms
                group: Building
                label: Add more rooms (up to 5 per project)
                students: true
                educators: true
                can_adjust: false
                enforced: false
              - key: publish-no-approval
                group: Sharing
                label: Publish without approval
                students: false
                educators: true
                can_adjust: false
                enforced: false
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes:
    get:
      tags:
      - classes
      summary: List Classes
      operationId: list_classes_api_v1_classes_get
      security:
      - HTTPBearer: []
      parameters:
      - name: school
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: 'admins only: just this school''s classes'
          title: School
        description: 'admins only: just this school''s classes'
        example: 728a4793-710c-42a6-97d5-4a67e4d98a23
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassResponse'
                title: Response List Classes Api V1 Classes Get
              example:
              - id: fe3b1883-e364-4ecd-a842-15c006d97cf5
                school_id: 728a4793-710c-42a6-97d5-4a67e4d98a23
                name: 1A
                member_count: 3
              - id: 023d785f-125b-493d-820a-f94055e143d9
                school_id: 728a4793-710c-42a6-97d5-4a67e4d98a23
                name: 2B
                member_count: 2
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - classes
      summary: Create Class
      description: An empty class. A teacher who makes one teaches it, so they are put in it straight
        away.
      operationId: create_class_api_v1_classes_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewClassRequest'
            example:
              name: B1
              school_id: c3d3ff32-1a11-49bf-a53e-9f49794a4d62
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassResponse'
              example:
                id: b3e609ca-f2ba-4c81-9c13-39aa7a4365fc
                school_id: c3d3ff32-1a11-49bf-a53e-9f49794a4d62
                name: B1
                member_count: 0
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes/{class_id}/members:
    get:
      tags:
      - classes
      summary: List Members
      description: The roster, for teachers and admins. 404 for a class the caller is not in; students
        may not list a roster.
      operationId: list_members_api_v1_classes__class_id__members_get
      security:
      - HTTPBearer: []
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Class Id
        example: 08e45862-7d69-453f-94cd-70b649d42dcc
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberResponse'
                title: Response List Members Api V1 Classes  Class Id  Members Get
              example:
              - id: 1077f156-88db-4490-a90c-d8fb180267dc
                display_name: t1
                role: teacher
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - classes
      summary: Add Member
      description: 'Put someone in a class. Already in it is fine: the answer is the same, nothing changes.'
      operationId: add_member_api_v1_classes__class_id__members_post
      security:
      - HTTPBearer: []
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Class Id
        example: 5592d7d8-d238-408f-92f5-5d04e1dc8a57
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
            example:
              actor_id: 4c8b2061-3133-4443-b818-c0caff88a5f4
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
              example:
                id: 4c8b2061-3133-4443-b818-c0caff88a5f4
                display_name: s3
                role: student
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes/{class_id}/members/{actor_id}:
    delete:
      tags:
      - classes
      summary: Remove Member
      description: Take someone out of a class. Their account and their work stay; only the membership
        goes.
      operationId: remove_member_api_v1_classes__class_id__members__actor_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Class Id
        example: 5592d7d8-d238-408f-92f5-5d04e1dc8a57
      - name: actor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Actor Id
        example: 4c8b2061-3133-4443-b818-c0caff88a5f4
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes/{class_id}/members/{actor_id}/move:
    post:
      tags:
      - classes
      summary: Move Member
      description: 'Out of this class and into another, in one commit. Both classes must be the caller''s
        to change

        and in the same school; the student keeps their work (see the module note).'
      operationId: move_member_api_v1_classes__class_id__members__actor_id__move_post
      security:
      - HTTPBearer: []
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Class Id
        example: b1ad1cad-ed91-4c8f-90d7-e7119f8996b7
      - name: actor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Actor Id
        example: 1b4e1f4e-fa92-4c03-b777-1d674baef7f3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequest'
            example:
              to_class_id: bd6e622e-3820-4eac-b3c6-dc0e55350410
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveResponse'
              example:
                student:
                  id: 1b4e1f4e-fa92-4c03-b777-1d674baef7f3
                  display_name: s1
                  role: student
                from_class:
                  id: b1ad1cad-ed91-4c8f-90d7-e7119f8996b7
                  school_id: 9662c265-c171-42db-8ec5-4df196223595
                  name: 1A
                  member_count: 2
                to_class:
                  id: bd6e622e-3820-4eac-b3c6-dc0e55350410
                  school_id: 9662c265-c171-42db-8ec5-4df196223595
                  name: 2B
                  member_count: 3
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects:
    get:
      tags:
      - projects
      summary: List Projects
      description: What the caller may see, newest edit first. Filters combine; X-Total-Count is the size
        before limit/offset.
      operationId: list_projects_api_v1_projects_get
      security:
      - HTTPBearer: []
