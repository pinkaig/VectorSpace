openapi: 3.1.0
info:
  title: VectorSpace API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
              example:
                status: ok
                service: vectorspace-api
  /api/v1/me:
    get:
      tags:
      - me
      summary: Me
      operationId: me_api_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
              example:
                id: b0305b70-de0d-41bd-9faa-1f3d5ebfb83b
                organisation_id: ead04526-5ac4-4872-8c6f-86e290a64b64
                display_name: s1
                role: student
                class_ids:
                - e4a3e53e-fc2d-4f5c-9713-c9068ad1e24a
      security:
      - HTTPBearer: []
  /api/v1/admin/schools:
    get:
      tags:
      - admin
      summary: List Schools
      description: 'One school: the caller''s own. See this module''s note on why there is no list above
        it.'
      operationId: list_schools_api_v1_admin_schools_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SchoolResponse'
                type: array
                title: Response List Schools Api V1 Admin Schools Get
              example:
              - id: de46ed8c-ff51-4a6b-adb3-4d9227282a90
                name: A
                students: 3
                educators: 2
                status: active
      security:
      - HTTPBearer: []
    post:
      tags:
      - admin
      summary: Add School
      operationId: add_school_api_v1_admin_schools_post
      responses:
        '501':
          description: Successful Response
          content:
            application/json:
              schema:
                type: 'null'
                title: Response Add School Api V1 Admin Schools Post
              example:
                detail: 'Adding a school needs a VThere operator role above the schools, which the data
                  model does not have yet: an admin belongs to one school. Create schools with python
                  -m app.provision --school-slug <slug> --school-name <name> for now.'
      security:
      - HTTPBearer: []
  /api/v1/admin/accounts:
    get:
      tags:
      - admin
      summary: List Accounts
      operationId: list_accounts_api_v1_admin_accounts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: school
        in: query
        required: false
        schema:
          type: string
          default: all
          title: School
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountResponse'
                title: Response List Accounts Api V1 Admin Accounts Get
              example:
              - id: c6959ff5-9ca1-40a2-a765-2002874a0941
                school_id: de46ed8c-ff51-4a6b-adb3-4d9227282a90
                name: admin
                email: admin@x.test
                role: admin
                class_names: []
                last_active: null
                status: invited
              - id: 677eab91-9212-4a95-a849-4a3c1414ee4c
                school_id: de46ed8c-ff51-4a6b-adb3-4d9227282a90
                name: s1
                email: s1@x.test
                role: student
                class_names:
                - 1A
                last_active: null
                status: invited
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - admin
      summary: Add Account
      description: 'The same provisioning path as the CSV tool and the seed: a login, an actor row, its
        classes.


        Nobody signs themselves up, so creating an account means creating a login first. With

        AUTH_DEV_BYPASS the login is a local "dev|..." stand-in; otherwise it is a real Auth0 user.


        The reply carries that login''s one-time password-set link, which is the only way in: nothing

        emails it, because create_user marks the address verified on purpose so that roster addresses

        need not be real ones. Hand it over and do not keep it -- it is a credential, so it is never

        logged, never stored and never put in a URL.'
      operationId: add_account_api_v1_admin_accounts_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccountRequest'
            example:
              school_id: faa4cfff-8991-40e1-9ac1-11d291e69d8e
              name: New Person
              email: New.Person@x.test
              role: student
              class_names:
              - 1A
              - 3C
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAccountResponse'
              example:
                id: 186ff664-a01b-454f-a742-00c507bfed97
                school_id: faa4cfff-8991-40e1-9ac1-11d291e69d8e
                name: New Person
                email: new.person@x.test
                role: student
                class_names:
                - 1A
                - 3C
                last_active: null
                status: invited
                invite_link: https://tenant.test/invite/new.person@x.test
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/accounts/{account_id}:
    patch:
      tags:
      - admin
      summary: Set Account Active
      description: Turn an account off or back on. Accounts are never deleted; their work would go with
        them.
      operationId: set_account_active_api_v1_admin_accounts__account_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
        example: bf703953-ffec-4323-a38b-dcd286626f59
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatchRequest'
            example:
              active: false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
              example:
                id: bf703953-ffec-4323-a38b-dcd286626f59
                school_id: 3de6a59c-69c5-4924-9a01-afad6cf4537c
                name: s1
                email: s1@x.test
                role: student
                class_names:
                - 1A
                last_active: null
                status: turned_off
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/overview:
    get:
      tags:
      - admin
      summary: Get Overview
      description: The four numbers, the schools table, what needs an admin, and what was published recently.
      operationId: get_overview_api_v1_admin_overview_get
      security:
      - HTTPBearer: []
      parameters:
      - name: school
        in: query
        required: false
        schema:
          type: string
          default: all
          title: School
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
              example:
                tiles:
                  schools:
                    value: 1
                    sub: 1 active
                  educators:
                    value: 2
                    sub: 2 not signed in yet
                  students:
                    value: 3
                    sub: 0 active this week
                  published:
                    value: 0
                    sub: 0 still drafts
                schools:
                - id: de46ed8c-ff51-4a6b-adb3-4d9227282a90
                  name: A
                  students: 3
                  educators: 2
                  status: active
                attention:
                - id: never-signed-in
                  text: 6 people have never signed in
                  action_label: See who
                  go_to: accounts
                recent: []
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/classes:
    get:
      tags:
      - classes
      summary: List Classes
      operationId: list_classes_api_v1_classes_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ClassResponse'
                type: array
                title: Response List Classes Api V1 Classes Get
              example:
              - id: 725d4db6-865b-4109-a939-fdd05f3a6695
                name: 1A
                member_count: 3
      security:
      - HTTPBearer: []
  /api/v1/classes/{class_id}/members:
    get:
      tags:
      - classes
      summary: List Members
      description: The roster, for teachers and admins. 404 for a class the caller is not in; students
        may not list a roster.
      operationId: list_members_api_v1_classes__class_id__members_get
      security:
      - HTTPBearer: []
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Class Id
        example: 725d4db6-865b-4109-a939-fdd05f3a6695
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberResponse'
                title: Response List Members Api V1 Classes  Class Id  Members Get
              example:
              - id: a3c791bf-d156-45a3-86af-6bee4ebfbd7c
                display_name: s1
                role: student
              - id: c443884e-fe7b-43eb-9e60-6c0604864e8e
                display_name: s2
                role: student
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects:
    get:
      tags:
      - projects
      summary: List Projects
      description: What the caller may see, newest edit first. Filters combine; X-Total-Count is the size
        before limit/offset.
      operationId: list_projects_api_v1_projects_get
      security:
      - HTTPBearer: []
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(project|template)$
          - type: 'null'
          title: Kind
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(draft|published|archived)$
          - type: 'null'
          title: Status
      - name: class_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Class Id
      - name: created_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Created By
      - name: mine
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Mine
        example: 'true'
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          description: part of the project name
          title: Q
        description: part of the project name
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectResponse'
                title: Response List Projects Api V1 Projects Get
              example:
              - id: c86e6845-62b2-4235-97fc-784e6f2a72a7
                organisation_id: 41c65edb-e12f-4468-a933-f75e9963b192
                created_by_id: 578cc5af-7e37-40ca-9027-b81326b57a1e
                class_id: e152d8fc-ab26-4afb-bfef-da24b3eda781
                template_id: dbb70cb6-9475-4cbe-8634-d6bac1dfc158
                template_revision: null
                kind: project
                name: Museum hall
                slug: museum-hall-9b7c5190
                status: draft
                current_version_id: null
                created_at: '2026-11-04T04:37:20'
                updated_at: '2026-11-04T04:37:20'
                created_by_name: s1
                class_name: 1A
                current_revision: 0
                saved_at: null
                saved_by_name: ''
                template_name: Museum hall
                assignment_id: 2ae52419-83af-4893-96bc-637bb9ffbe1a
