  /api/v1/projects/{project_id}/assign:
    post:
      tags:
      - projects
      summary: Assign Project
      description: 'Send a student their own copy of a project or template: the teacher''s "send to student".


        The copy belongs to the student (they can open and save it; the teacher can read it through the

        class). Its first revision is labelled with who sent it, so the history shows where it came from.

        The copy joins the source''s assignment for that class (made on the first send), which is what

        marks the source as sent: it can no longer be deleted, only archived.'
      operationId: assign_project_api_v1_projects__project_id__assign_post
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
        example: 730a262b-61b8-4c6c-98e1-2e427615f97f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRequest'
            example:
              student_id: 8e874a30-a627-4124-abf5-48313a77e0e4
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
              example:
                id: 800c818c-e2fd-4c02-a3cd-a4b3479ca548
                organisation_id: a3f51301-4319-4c77-af9c-19a824db928e
                created_by_id: 8e874a30-a627-4124-abf5-48313a77e0e4
                class_id: 588e3d42-81e8-4993-aaea-5885db9c1ac4
                template_id: 730a262b-61b8-4c6c-98e1-2e427615f97f
                template_revision: 1
                kind: project
                name: Gallery walk
                slug: gallery-walk-edb5e84a
                status: draft
                current_version_id: d0e73af4-bb7d-44c2-9490-372173988bd3
                created_at: '2026-11-04T04:37:21'
                updated_at: '2026-11-04T04:37:21'
                created_by_name: s1
                class_name: 1A
                current_revision: 1
                saved_at: '2026-11-04T04:37:21'
                saved_by_name: t1
                template_name: Gallery walk
                assignment_id: 03a005f5-0fe0-4ad5-a21f-49166ea1686d
                task: ''
                due_at: null
                assigned_by_name: t1
                sent: false
                published_copies: 0
                assignment_ids: []
                showcase: false
                review_status: null
                review_grade: null
                review_comment: null
                share_with: null
                submitted_at: null
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}/push-setup:
    post:
      tags:
      - projects
      summary: Push Project Setup
      description: 'Carries the teacher''s spots, locks and starter objects into copies students already
        have

        (see teacher_setup.py). The template''s saved content is what is carried, so save first.'
      operationId: push_project_setup_api_v1_projects__project_id__push_setup_post
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
        example: ea287097-6a65-4111-b222-f42047c28d19
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSetupResponse'
              example:
                updated: 1
                skipped: 0
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}/assign-class:
    post:
      tags:
      - projects
      summary: Assign Class
      description: 'Template setup''s "Assign to <class>": the class''s assignment of this project, with
        its

        mission brief, and a copy for every student in the class who has none yet.


        One assignment per (class, project): assigning again updates its brief, task and due date,

        and because the brief is read from the assignment (not from each copy), students who

        already have a copy see the new brief the next time they open it.'
      operationId: assign_class_api_v1_projects__project_id__assign_class_post
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
        example: dbb70cb6-9475-4cbe-8634-d6bac1dfc158
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignClassRequest'
            example:
              class_id: e152d8fc-ab26-4afb-bfef-da24b3eda781
              mission_brief:
                due: '2026-11-20'
                todos:
                - id: t1
                  text: Place three exhibits
                rules:
                - id: r1
                  text: Label every exhibit
              task: Build a museum of your hobby
              due_at: '2026-11-20'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignClassResponse'
              example:
                assignment_id: 2ae52419-83af-4893-96bc-637bb9ffbe1a
                students: 2
                sent: 2
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
