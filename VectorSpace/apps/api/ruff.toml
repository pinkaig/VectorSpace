# Lint settings for the API. Run from VectorSpace/apps/api:  ruff check .
#
# The rule set is ruff's own default for the version pinned in requirements.txt
# (0.17.3), which covers far more than the old E/F-only default. The version is
# pinned because those defaults change between releases; bump it on purpose and
# re-run, never let CI pick a newer one.

target-version = "py312"   # matches the Dockerfile's python:3.12-slim

[lint]
extend-ignore = [
  # FastAPI's dependency injection is written as `x = Depends(get_x)` and
  # `q: str = Query(...)` in parameter defaults; that is the framework's idiom.
  "B008",
]

[lint.isort]
# apps/api/alembic/ (our migrations folder) shadows the package name, so without
# this the sorter files `from alembic import op` under first-party imports.
known-third-party = ["alembic"]

[lint.per-file-ignores]
# The diagnostic scripts catch every exception on purpose: each check reports
# the failure and moves on to the next one instead of crashing.
"scripts/check_*.py" = ["BLE001"]
# The generators emit JavaScript. `%` formatting keeps JS braces readable (an
# f-string would need every { doubled), and test scripts are built as lists of
# lines joined with "\n" so every request reads the same way.
"postman/build_*.py" = ["UP031", "FLY002"]
