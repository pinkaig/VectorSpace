<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VectorSpace V3 (sound prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#E4E0F4}
#stage{position:absolute;left:50%;top:50%;width:1440px;height:900px;transform-origin:center center}
#app{width:1440px;height:900px}
button{transition:background-color .18s ease,border-color .18s ease,color .18s ease,filter .18s ease,transform .12s ease}
button:hover{filter:brightness(.97)}
button:active{transform:scale(.97)}
input:focus,textarea:focus{outline:3px solid #B9AEDB;outline-offset:1px}
.anim-fade{animation:vsFade .28s ease both}
.anim-pop{animation:vsPop .26s cubic-bezier(.2,.9,.3,1.25) both}
.anim-slide{animation:vsSlide .3s cubic-bezier(.2,.8,.2,1) both}
.anim-down{animation:vsDown .38s cubic-bezier(.2,.9,.3,1.15) both}
.anim-drop{transform-box:fill-box;transform-origin:center bottom;animation:vsDrop .5s cubic-bezier(.3,1.5,.5,1) both}
.pulse{transform-box:fill-box;transform-origin:center;animation:vsPulse 1.4s ease-in-out infinite}
.nudge{animation:vsNudge 2.2s ease-in-out infinite}
svg .anim-pop{transform-box:fill-box;transform-origin:center}
@keyframes vsDown{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
@keyframes vsFade{from{opacity:0}to{opacity:1}}
@keyframes vsPop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes vsSlide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes vsDrop{0%{transform:translateY(-40px) scale(1,1)}60%{transform:translateY(0) scale(1.06,.92)}100%{transform:none}}
@keyframes vsPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:.6}}
@keyframes vsNudge{0%,100%{transform:translate(0,0)}25%{transform:translate(10px,-8px)}50%{transform:translate(0,-12px)}75%{transform:translate(-8px,-4px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="./soundboard.css">
</head>
<body>
<div id="stage"><div id="app"></div></div>
<template id="tpl">
<div style="position: relative; box-sizing: border-box; width: 100%; height: 900px; overflow: hidden; background: #F4F2FB; font-family: 'Nunito', system-ui, sans-serif; text-wrap: pretty; color: #1F1B3A; padding: 12px; display: flex; flex-direction: column; gap: 12px">

<sc-if value="{{ showPreviewBar }}" hint-placeholder-val="{{ false }}">
<div style="flex: 0 0 auto; display: flex; align-items: center; gap: 12px; background: #1F1B3A; color: #FFFFFF; border-radius: 14px; padding: 6px 6px 6px 16px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
<span style="font-size: 14px; font-weight: 800">Teacher preview</span>
<span style="font-size: 14px; color: #D5CEF2; flex: 1">You're seeing exactly what students see. Nothing you do here is saved.</span>
<button onClick="{{ exitPreview }}" style="font-family: inherit; cursor: pointer; min-height: 36px; padding: 0 14px; border: none; background: #FFFFFF; color: #1F1B3A; border-radius: 10px; font-size: 14px; font-weight: 800">Exit preview</button>
</div>
</sc-if>

<sc-if value="{{ isHome }}" hint-placeholder-val="{{ false }}">
<header style="flex: 0 0 auto; display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E3DFF3; border-radius: 18px; padding: 10px 14px">
<div style="width: 40px; height: 40px; border-radius: 12px; background: #5B4BD6; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"></path></svg>
</div>
<div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; flex: 1">VectorSpace</div>
<div aria-hidden="true" style="width: 1px; height: 32px; background: #E3DFF3; margin: 0 6px"></div><div role="group" aria-label="Your account" style="display: flex; align-items: center; gap: 10px; background: #F4F2FB; border: 1px solid #E3DFF3; border-radius: 14px; padding: 4px 4px 4px 6px"><div style="width: 34px; height: 34px; border-radius: 50%; background: #FDE9D3; color: #5C3A00; font-weight: 800; display: flex; align-items: center; justify-content: center">A</div><div style="line-height: 1.15; padding-right: 4px"><div style="font-size: 14px; font-weight: 800">Aisyah</div><div style="font-size: 12px; color: #5E5878">Sec 2B · Student</div></div><button onClick="{{ signOut }}" style="font-family: inherit; cursor: pointer; min-height: 34px; padding: 0 12px; border: 1px solid #E3DFF3; background: #FFFFFF; border-radius: 10px; font-size: 13px; font-weight: 800; color: #3B3363">Sign out</button></div>
</header>
<main style="flex: 1 1 auto; min-height: 0; width: 100%; max-width: 1100px; margin: 0 auto; padding: 16px 8px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<div>
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 36px">Hi Aisyah</h1>
<p style="margin: 4px 0 0; font-size: 17px; color: #5E5878">You have one project waiting for you.</p>
</div>
<div style="font-size: 13px; font-weight: 800; color: #5E5878; letter-spacing: 0.04em">FROM MS TAN</div>
<div style="display: flex; gap: 24px; background: #FFFFFF; border: 1px solid #E3DFF3; border-radius: 24px; padding: 20px">
<div style="flex: 1 1 0; aspect-ratio: 1000 / 560; background: #DCEBFA; border-radius: 18px; overflow: hidden">
<svg viewBox="0 0 1000 560" style="width: 100%; height: 100%">
<polygon points="100,330 500,140 500,60 100,250" fill="#EFEAFA" stroke="#B9AEDB" stroke-width="3"></polygon>
<polygon points="500,140 900,330 900,250 500,60" fill="#E3DBF5" stroke="#B9AEDB" stroke-width="3"></polygon>
<polygon points="100,330 500,140 900,330 500,520" fill="#CDE6BE" stroke="#8DBF78" stroke-width="3"></polygon>
<polygon points="270,330 300,316 330,330 300,344" fill="#F3E6CC" stroke="#9C8A6A" stroke-width="2"></polygon>
<polygon points="270,330 300,344 300,394 270,380" fill="#E4D2AE" stroke="#9C8A6A" stroke-width="2"></polygon>
<polygon points="300,344 330,330 330,380 300,394" fill="#D6C196" stroke="#9C8A6A" stroke-width="2"></polygon>
<polygon points="680,310 720,291 760,310 720,329" fill="#EAF4FD" stroke="#6F9CC8" stroke-width="2"></polygon>
<polygon points="680,310 720,329 720,399 680,380" fill="#CFE3F6" stroke="#6F9CC8" stroke-width="2"></polygon>
<polygon points="720,329 760,310 760,380 720,399" fill="#BCD6F0" stroke="#6F9CC8" stroke-width="2"></polygon>
</svg>
</div>
<div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 12px; justify-content: center">
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="background: #FFF5E3; color: #5C3A00; border: 1px solid #F3D29C; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 800">Due Friday</span>
<span style="background: #F4F2FB; color: #3B3363; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 800">Not started</span>
</div>
<h2 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 30px">Dinosaur museum</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #3B3363">Build a virtual exhibition about dinosaurs. Add at least 3 exhibits with facts, and one thing that reacts when visitors click.</p>
<p style="margin: 0; font-size: 14px; color: #5E5878">Starts from the museum template · 2 rooms ready for you</p>
<button onClick="{{ startProject }}" style="align-self: flex-start; font-family: inherit; min-height: 52px; padding: 0 28px; border: none; border-radius: 14px; background: #5B4BD6; color: #FFFFFF; font-size: 17px; font-weight: 800; cursor: pointer">Start building</button>
</div>
</div>
<div style="font-size: 13px; font-weight: 800; color: #5E5878; letter-spacing: 0.04em">YOUR OTHER PROJECTS</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<div style="background: #FFFFFF; border: 1px solid #E3DFF3; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<div style="font-weight: 800; font-size: 16px">Ancient Egypt tour</div>
<div style="font-size: 14px; color: #1E7A50; font-weight: 700">Published · 34 visits</div>
</div>
<div style="background: #FFFFFF; border: 1px solid #E3DFF3; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<div style="font-weight: 800; font-size: 16px">Space station</div>
<div style="font-size: 14px; color: #5E5878; font-weight: 700">Draft · edited 3 days ago</div>
</div>
</div>
</main>
</sc-if>

<sc-if value="{{ isSignIn }}" hint-placeholder-val="{{ false }}">
<div style="flex: 1 1 auto; min-height: 0; display: flex; gap: 12px">
<section style="flex: 1 1 0; position: relative; background: #5B4BD6; border-radius: 24px; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; color: #FFFFFF; overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5B4BD6" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"></path></svg>
</div>
<div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px">VectorSpace</div>
</div>

<p style="margin: 10px 0 0; font-size: 17px; line-height: 1.5; color: #E6E1FB; max-width: 520px">Here's what students have made this term.</p>
<div aria-roledescription="carousel" aria-label="Museums made by students" style="flex: 1 1 auto; min-height: 0; margin-top: 22px; display: flex; flex-direction: column; gap: 14px">

" cy="315" rx="46" ry="20.9091" fill="#000000" opacity="0.12"></ellipse><polygon points="550,312 565,276 605,268 632,296 612,322" fill="#8A84A3"></polygon><circle cx="580" cy="296" r="7" fill="#6B6588"></circle><circle cx="606" cy="288" r="5" fill="#6B6588"></circle></svg></sc-if>

</ellipse><ellipse cx="590" cy="318" rx="30" ry="13.6364" fill="#000000" opacity="0.12"></ellipse><path d="M570 260 q-14 30 0 58 h40 q14 -28 0 -58z" fill="#B5652B"></path><rect x="574" y="250" width="32" height="12" rx="4" fill="#8E4B1C"></rect><path d="M568 288 h44" stroke="#F3DEAE" stroke-width="4"></path></svg></sc-if>
</div>
<span style="position: absolute; left: 16px; top: 16px; background: #FFFFFF; color: #3326A0; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 800">Made by a student</span>
<span style="position: absolute; right: 16px; top: 16px; background: rgba(31,27,58,0.55); color: #FFFFFF; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 800">{{ sl.meta }}</span>
<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; color: #1F1B3A; padding: 12px 18px; display: flex; align-items: center; gap: 12px">
<div style="{{ sl.avatarStyle }}">{{ sl.initial }}</div>
<div style="flex: 1; min-width: 0"><div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px">{{ sl.title }}</div><div style="font-size: 13px; color: #5E5878">{{ sl.by }}</div></div>
<span style="background: #EEEAFB; color: #3326A0; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 800">{{ sl.topic }}</span>
</div>
</div>

<script>
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(o) { this.state = Object.assign({}, this.state, typeof o === 'function' ? o(this.state) : o); schedule(); }
  forceUpdate() { schedule(); }
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    var built = { view: 'editor', placed: true, factAdded: true };
    var presets = {
      home: { view: 'home' },
      tutorial: { view: 'editor', step: 1, tutorial: true },
      place: { view: 'editor', step: 1, dragging: true },
      adjust: { view: 'editor', step: 1, placed: true, sel: true },
      views: { view: 'editor', step: 1, placed: true, sel: true, cam: 'top' },
      info: { view: 'editor', step: 2, placed: true, sel: true, panel: 'fact' },
      rulepick: Object.assign({}, built, { step: 3, sel: true, open: 'when', when: null, act: null, reactTipSeen: true }),
      reacttip: Object.assign({}, built, { step: 3, sel: true }),
      infolinked: Object.assign({}, built, { step: 2, sel: true, autoCard: true }),
      rule: Object.assign({}, built, { step: 3, sel: true, when: 'zone', act: 'sound', reactTipSeen: true }),
      playtap: Object.assign({}, built, { view: 'play', step: 4, move: 'tap' }),
      playwalk: Object.assign({}, built, { view: 'play', step: 4, move: 'walk' }),
      playtour: Object.assign({}, built, { view: 'play', step: 4, move: 'tour', tourIdx: 1, playCard: true }),
      publish: Object.assign({}, built, { step: 4, publish: true }),
      signin: { view: 'signin' },
      aover: { view: 'admin', aPage: 'over' },
      aperm: { view: 'admin', aPage: 'perm' },
      aacc: { view: 'admin', aPage: 'acc' },
      aenv: { view: 'admin', aPage: 'env' },
      treview: { view: 'treview' },
      tresults: { view: 'tresults' },
      preview: { view: 'home', previewing: true },
      thome: { view: 'thome' },
      tsetup: { view: 'tsetup' },
      tnew: { view: 'thome', newProj: 'exhibit', npName: 'Volcano museum' },
      tassigned: { view: 'thome', justAssigned: true, projTitle: 'Volcano museum', projClass: '3A', projFrom: 'Virtual exhibition', projDue: 'Friday, 30 Oct', newCard: { title: 'Volcano museum', cls: '3A', due: 'Friday, 30 Oct' } },
      brief: { view: 'editor', step: 1, briefOpen: true },
      loading: { view: 'editor', step: 1, popup: 'loading' },
      error: { view: 'editor', step: 1, placed: true, sel: true, popup: 'error' },
      rooms: Object.assign({}, built, { step: 1, sel: false, roomsOpen: true, roomAdded: true })
    };
    presets.react = presets.rule;
    presets.play = presets.playtap;
    var base = {
      view: 'home', step: 1, tutorial: false, tutIdx: 0, placed: false, dragging: false, sel: false,
      gizmo: 'move', snap: true, showExact: false, treeOpen: false, walls: 'half', cam: 'angled',
      cat: 'exhibits', item: 'Dino skeleton', panel: null, factAdded: false, soundWhere: 'near',
      open: null, when: null, act: null, query: '',
      opt: { times: 'first', play: 'loopzone', vol: 'normal', hear: 'near', vplay: 'once', vsound: 'on', close: 'x', speed: 'normal', vis: 'show', arrive: 'start', target: 'tab', after: '5', look: '1' },
      wait: 0, move: 'tap', tourIdx: 0, playCard: false, publish: false, sent: false, access: 'link',
      vmoves: { tap: true, walk: true, tour: true },
      briefOpen: false, roomsOpen: false, roomAdded: false, popup: null,
      mode: 'balanced', locks: { walls: true, door: true, spots: false }, firstRun: false,
      previewing: false, aPage: 'over', reviewIdx: 0, decisions: {}, resIdx: 0, range: '7', accFilter: 'all', permDirty: false, permSaved: false,
      perms: {
        audio: [1, 1, 1], video: [0, 1, 1], rooms: [1, 1, 1], free: [0, 1, 1],
        noapprove: [0, 1, 0], public: [0, 0, 0], unlisted: [1, 1, 1], signin: [1, 1, 1],
        create: [0, 1, 0], templates: [0, 1, 0], results: [1, 1, 0], remove: [0, 0, 0]
      },
      envOn: { hall: true, classroom: true, dock: false, temple: false },
      packOn: { basics: true, dinos: true, egypt: true, space: false, rome: false }
    };
    var p = presets[props.screen || 'signin'] || presets.signin;
    this.state = Object.assign({}, base, p);
  }
  renderVals() {
    var s = this.state;
    var self = this;
    var set = function (o) { return function () { self.setState(o); }; };
    var isApp = s.view === 'editor' || s.view === 'play';
    var isPlay = s.view === 'play';
    var isBuild = s.view === 'editor';
    var segBtn = function (on, extra) {
      return 'font-family: inherit; cursor: pointer; border-radius: 10px; font-weight: 800; ' + (extra || '') +
        (on ? 'background: #5B4BD6; color: #FFFFFF; border: 1px solid #5B4BD6;' : 'background: #FFFFFF; color: #3B3363; border: 1px solid #E3DFF3;');
    };
    var steps = [[1, 'Place things'], [2, 'Add info'], [3, 'Make it react'], [4, 'Play and share']];
    var stepPills = steps.map(function (st) {
      var n = st[0];
      var cur = n === s.step;
      var done = n < s.step;
      return {
        num: done ? '✓' : String(n), label: st[1],
        style: 'font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 6px; border-radius: 999px; font-size: 14px; font-weight: 800; white-space: nowrap; ' +
          (cur ? 'background: #5B4BD6; color: #FFFFFF; border: 1px solid #5B4BD6;' : done ? 'background: #E3F5EC; color: #165E3D; border: 1px solid #9FD6BA;' : 'background: #FFFFFF; color: #5E5878; border: 1px solid #E3DFF3;'),
        numStyle: 'width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; ' +
          (cur ? 'background: #FFFFFF; color: #3326A0;' : done ? 'background: #2E9E6A; color: #FFFFFF;' : 'background: #F4F2FB; color: #5E5878;'),
        pick: function () {
          if (n === 4) { self.setState({ step: 4, view: 'play', publish: false, tutorial: false, playCard: false }); return; }
          self.setState({ step: n, view: 'editor', publish: false, tutorial: false, sel: s.placed ? true : s.sel, panel: null, open: null, dragging: n === 1 && !s.placed });
        }
      };
    });
    var tuts = [
      ['Welcome to your museum!', 'You will build it in 4 steps. The bar at the top always shows which step you are on.'],
      ['Look around', 'Drag on the room to look around. Use the View buttons in the corner to see it from the top, front or side.'],
      ['Add your first exhibit', 'Pick something from the catalogue at the bottom, then click the floor to drop it in.']
    ];
    var tut = tuts[s.tutIdx] || tuts[0];
    var hasCard = isBuild && s.sel && !s.dragging;
    var h = s.walls === 'full' ? 190 : s.walls === 'half' ? 60 : 12;
    var wallOrder = ['full', 'half', 'off'];
    var wallNames = { full: 'Full', half: 'Half', off: 'Off' };
    var gizmoOn = isBuild && hasCard && s.step === 1;
    var angled = s.cam === 'angled';
    var flat = !angled;
    var camOpts = [['angled', 'Angled'], ['top', 'Top'], ['front', 'Front'], ['side', 'Side']].map(function (c) {
      return { label: c[1], style: segBtn(c[0] === s.cam, 'min-height: 40px; padding: 0 12px; font-size: 14px; '), pick: set({ cam: c[0] }) };
    });
    var moveOpts = [['tap', 'Tap to go'], ['walk', 'Walk'], ['tour', 'Tour spots']].map(function (m) {
      return { label: m[1], style: segBtn(m[0] === s.move, 'min-height: 40px; padding: 0 12px; font-size: 14px; '), pick: set({ move: m[0] }) };
    });
    var spots = ['Entrance', 'Dino skeleton', 'Display case'];
    var pin = function (i) { return i === s.tourIdx; };
    var gizmoHints = { move: 'Drag the coloured arrows. The yellow square slides it along the floor.', rotate: 'Drag the green ring to spin it around.', size: 'Drag a white corner to make it bigger or smaller.' };
    var tabs = [[1, 'Position'], [2, 'Info'], [3, 'Reactions']].map(function (t) {
      var on = t[0] === s.step;
      return {
