version: "1"
projects:
- name: VectorSpace
  environments:
  - name: Production
    services:
    - type: web
      name: vectorspace-api
      runtime: docker
      repo: https://github.com/gsherman01/Project5_Team17_DoReMi-yaki
      branch: Working
      plan: free
      envVars:
      - key: AUTH_DEV_BYPASS
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_ENV
        sync: false
      - key: DATABASE_URL
        sync: false
      region: singapore
      healthCheckPath: /health
      dockerContext: .
      dockerfilePath: Dockerfile
      autoDeployTrigger: commit
      buildFilter:
        paths:
        - '**'
      rootDir: VectorSpace/apps/api
    - type: web
      name: vectorspace
      runtime: static
      repo: https://github.com/gsherman01/Project5_Team17_DoReMi-yaki
      branch: Working
      envVars:
      - key: VITE_API_URL
        sync: false
      - key: NODE_VERSION
        sync: false
      buildCommand: 'npm ci && npm run build  '
      staticPublishPath: dist
      autoDeployTrigger: commit
      buildFilter:
        paths:
        - '**'
      rootDir: VectorSpace/
