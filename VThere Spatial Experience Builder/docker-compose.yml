services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vthere}
      POSTGRES_USER: ${POSTGRES_USER:-vthere_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vthere_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vthere_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vthere_app} -d ${POSTGRES_DB:-vthere}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vthere_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vthere_minio_local}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - vthere_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vthere_postgres_data:
  vthere_minio_data:
